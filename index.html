<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="d-flex justify-content-center gap-3 mt-5">
        <input id="searchText" class="p-1" type="text" placeholder="Search your Item">
        <button id="searchBtn" class="border px-5 rounded-1">Search</button>
    </div>
    <div class="w-100 mx-auto mt-5 d-flex justify-content-center align-items-start">
        <div id="items_container" class="d-flex flex-wrap flex-grow-0 gap-3">

        </div>
        <div id="card_container" class="col-3 text-center">
            <h1>Total Cart: <span id="cardNumber">0</span></h1>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">SL</th>
                        <th scope="col">Img</th>
                        <th scope="col">Name</th>
                    </tr>
                </thead>
                <tbody id="tbody">

                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="modalContainer">
        
    </div>


    <!-- script Js -->
    <script src="./app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
